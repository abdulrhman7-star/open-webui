<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 الباحث الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      padding: 24px 16px 40px;
      color: #fff;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 32px 28px;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 72px rgba(0,0,0,.55);
    }

    h1 {
      text-align: center;
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      opacity: .55;
      margin-bottom: 28px;
      font-size: 1rem;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      border-bottom: 2px solid rgba(255,255,255,.06);
      padding-bottom: 16px;
      margin-bottom: 26px;
    }
    .tab-btn {
      padding: 10px 26px;
      border: none;
      border-radius: 50px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.6);
      font-size: .95rem;
      font-weight: 600;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background .2s, color .2s, transform .15s, box-shadow .2s;
    }
    .tab-btn:hover {
      background: rgba(255,255,255,.12);
      color: #fff;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      box-shadow: 0 4px 22px rgba(245,87,108,.35);
    }
    .tab-content { display: none; animation: fadeUp .35s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

    /* ── Fields ── */
    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .input-group label {
      min-width: 130px;
      font-weight: 600;
      opacity: .8;
      font-size: .95rem;
    }
    .input-group input,
    .input-group select,
    .input-group textarea {
      flex: 1;
      min-width: 200px;
      padding: 11px 16px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: .97rem;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      transition: border-color .25s, background .25s, box-shadow .25s;
    }
    .input-group input:focus,
    .input-group select:focus,
    .input-group textarea:focus {
      border-color: #f5576c;
      background: rgba(255,255,255,.12);
    }
    .input-group input::placeholder,
    .input-group textarea::placeholder { color: rgba(255,255,255,.35); }
    .input-group select option { background: #1a1a2e; color: #fff; }
    .input-group textarea { min-height: 72px; resize: vertical; }
    .hint { font-size: .78rem; opacity: .45; width: 100%; margin-top: 2px; }

    /* ── Site-search: URL field activation ── */
    .site-url-wrap { flex: 1; min-width: 200px; position: relative; }
    .site-url-wrap input {
      width: 100%;
      transition: border-color .3s, box-shadow .3s, background .3s;
    }
    .site-url-wrap.active-glow input {
      border-color: #39d353;
      background: rgba(57,211,83,.1);
      box-shadow: 0 0 0 3px rgba(57,211,83,.2), 0 0 18px rgba(57,211,83,.15);
    }
    .active-indicator {
      display: none;
      position: absolute;
      top: -22px;
      right: 0;
      font-size: .72rem;
      color: #39d353;
      font-weight: 600;
      animation: pulse-txt 1.4s ease-in-out infinite;
    }
    .site-url-wrap.active-glow .active-indicator { display: block; }
    @keyframes pulse-txt {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* crawl progress strip */
    .crawl-status {
      display: none;
      margin-top: 12px;
      padding: 10px 16px;
      background: rgba(57,211,83,.08);
      border: 1px solid rgba(57,211,83,.25);
      border-radius: 10px;
      font-size: .85rem;
      color: #39d353;
      animation: fadeUp .3s ease;
    }
    .crawl-status.visible { display: flex; align-items: center; gap: 10px; }
    .crawl-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #39d353;
      animation: blink .8s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.2;} }

    /* ── Execute button ── */
    .btn-execute {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: transform .2s, box-shadow .2s, opacity .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-execute:hover  { transform: scale(1.02); box-shadow: 0 8px 32px rgba(245,87,108,.45); }
    .btn-execute:active { transform: scale(.98); }
    .btn-execute:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── Loader ── */
    .loader {
      display: none;
      text-align: center;
      padding: 50px 20px;
    }
    .loader .spinner {
      border: 4px solid rgba(255,255,255,.1);
      border-top-color: #f5576c;
      border-radius: 50%;
      width: 52px; height: 52px;
      animation: spin .75s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { opacity: .6; font-size: 1rem; }

    /* ── Results area ── */
    .results-area { margin-top: 28px; }
    .results-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .results-stats .count  { font-weight: 700; color: #f093fb; font-size: 1rem; }
    .results-stats .meta   { opacity: .45; font-size: .85rem; }

    /* ── Result card with thumbnail ── */
    .result-card {
      display: flex;
      gap: 18px;
      background: rgba(255,255,255,.04);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      border-right: 4px solid #f5576c;
      align-items: flex-start;
      transition: background .2s;
      animation: fadeUp .3s ease;
    }
    .result-card:hover { background: rgba(255,255,255,.07); }

    .result-thumb {
      flex: 0 0 140px;
      width: 140px; height: 140px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      flex-shrink: 0;
    }
    .result-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .result-thumb .no-img { font-size: 2.6rem; opacity: .25; }

    .result-details { flex: 1; min-width: 0; }
    .result-details .r-title {
      font-size: 1.1rem; font-weight: 700; color: #f093fb; margin-bottom: 4px;
    }
    .result-details .r-title a { color: inherit; text-decoration: none; }
    .result-details .r-title a:hover { text-decoration: underline; }
    .result-details .r-url {
      font-size: .8rem; opacity: .45; word-break: break-all;
      margin-bottom: 10px; direction: ltr; text-align: left;
    }
    .result-details .r-url a { color: #f093fb; text-decoration: none; }
    .result-details .r-url a:hover { text-decoration: underline; }
    .result-details .r-body {
      background: rgba(0,0,0,.25);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .88rem;
      line-height: 1.75;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      direction: auto;
      text-align: start;
      color: rgba(255,255,255,.8);
    }
    .result-details .r-body::-webkit-scrollbar { width: 5px; }
    .result-details .r-body::-webkit-scrollbar-thumb { background: #f5576c; border-radius: 10px; }
    .result-details .r-meta {
      display: flex; gap: 10px; margin-top: 10px;
      flex-wrap: wrap; font-size: .78rem; opacity: .45;
    }
    .result-details .r-meta span {
      background: rgba(255,255,255,.05); padding: 3px 12px; border-radius: 20px;
    }

    /* ── keyword highlight in excerpt ── */
    mark {
      background: rgba(245,87,108,.35);
      color: #fff;
      border-radius: 3px;
      padding: 0 2px;
    }

    /* ── OSINT summary card ── */
    .summary-card {
      background: linear-gradient(135deg, rgba(240,147,251,.07), rgba(245,87,108,.05));
      border: 1px solid rgba(240,147,251,.3);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 18px;
      animation: fadeUp .4s ease;
    }
    .summary-card .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      font-size: .75rem; font-weight: 700;
      padding: .2rem .8rem; border-radius: 20px;
      margin-bottom: 10px;
    }
    .summary-card .adv-query { font-size: .78rem; opacity: .45; margin-bottom: 10px; direction: ltr; text-align: left; }
    .summary-card .summary-text { font-size: .95rem; line-height: 1.95; white-space: pre-wrap; direction: auto; text-align: start; }

    /* ── crawl link list ── */
    .link-list { list-style: none; }
    .link-list li { padding: .42rem 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: .86rem; direction: ltr; text-align: left; }
    .link-list li:last-child { border-bottom: none; }
    .link-list a { color: #f093fb; word-break: break-all; text-decoration: none; }
    .link-list a:hover { text-decoration: underline; }

    /* ── agent output ── */
    .agent-pre { background: rgba(0,0,0,.3); padding: 16px; border-radius: 12px; overflow: auto; max-height: 420px; font-size: .88rem; white-space: pre-wrap; direction: auto; text-align: start; }

    /* ── Error / empty ── */
    .error-banner {
      background: rgba(245,87,108,.12);
      border: 1px solid #f5576c;
      color: #f5576c;
      padding: 14px 20px;
      border-radius: 12px;
      margin-top: 16px;
      text-align: center;
    }
    .no-results { text-align: center; padding: 50px; opacity: .4; font-size: 1.1rem; }

    /* lightbox */
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 999; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 10px; }
    #lb-close { position: absolute; top: 1.5rem; left: 1.5rem; background: none; border: none; color: #fff; font-size: 2.2rem; cursor: pointer; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      h1 { font-size: 1.9rem; }
      .result-card { flex-direction: column; align-items: center; }
      .result-thumb { flex: 0 0 100px; width: 100%; height: 120px; }
      .tab-btn { font-size: .82rem; padding: 8px 16px; }
      .container { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>🔥 الباحث الذكي</h1>
  <p class="subtitle">ابحث، استخرج، وحلّل — بحث عميق داخل أي موقع بالذكاء الاصطناعي</p>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="search">🔍 بحث</button>
    <button class="tab-btn" data-tab="site">🎯 بحث في موقع</button>
    <button class="tab-btn" data-tab="scrape">📄 استخراج</button>
    <button class="tab-btn" data-tab="agent">🧠 وكيل ذكي</button>
    <button class="tab-btn" data-tab="crawl">🕷️ زحف</button>
    <button class="tab-btn" data-tab="osint">📊 تقرير OSINT</button>
  </div>

  <!-- ====== بحث ====== -->
  <div id="tab-search" class="tab-content active">
    <div class="input-group">
      <label>🔎 كلمة البحث</label>
      <input id="search-query" type="text" placeholder="مثال: تقنية الذكاء الاصطناعي 2025" />
    </div>
    <div class="input-group">
      <label>📊 عدد النتائج</label>
      <input id="search-limit" type="number" value="10" min="1" max="50" style="max-width:120px;" />
    </div>
    <button class="btn-execute" id="btn-search">🔍 ابحث الآن</button>
  </div>

  <!-- ====== بحث في موقع ====== -->
  <div id="tab-site" class="tab-content">
    <div class="input-group">
      <label>🔎 كلمة البحث</label>
      <input id="site-query" type="text" placeholder="مثال: الذكاء الاصطناعي" autocomplete="off" />
    </div>
    <div class="input-group" style="position:relative; padding-top: 18px;">
      <label>🌐 رابط الموقع</label>
      <div class="site-url-wrap" id="site-url-wrap">
        <span class="active-indicator">🟢 سيتم الزحف والبحث في هذا الموقع…</span>
        <input id="site-url" type="text" placeholder="مثال: https://aljazeera.net" />
      </div>
    </div>
    <div class="crawl-status" id="crawl-status">
      <div class="crawl-dot"></div>
      <span id="crawl-status-text">جارٍ الزحف عبر صفحات الموقع والبحث عن الكلمة المفتاحية…</span>
    </div>
    <button class="btn-execute" id="btn-site">🎯 ابحث في كل صفحات الموقع</button>
  </div>

  <!-- ====== استخراج ====== -->
  <div id="tab-scrape" class="tab-content">
    <div class="input-group">
      <label>🔗 رابط الصفحة</label>
      <input id="scrape-url" type="url" placeholder="https://example.com/article" />
    </div>
    <button class="btn-execute" id="btn-scrape">📄 استخرج المحتوى</button>
  </div>

  <!-- ====== وكيل ذكي ====== -->
  <div id="tab-agent" class="tab-content">
    <div class="input-group">
      <label>🧠 سؤالك</label>
      <textarea id="agent-query" placeholder="مثال: ما هي أبرز اتجاهات الذكاء الاصطناعي؟"></textarea>
    </div>
    <button class="btn-execute" id="btn-agent">🧠 اسأل الوكيل</button>
  </div>

  <!-- ====== زحف ====== -->
  <div id="tab-crawl" class="tab-content">
    <div class="input-group">
      <label>🌐 رابط الموقع</label>
      <input id="crawl-url" type="url" placeholder="https://example.com" />
    </div>
    <div class="input-group">
      <label>📊 الحد الأقصى</label>
      <input id="crawl-limit" type="number" value="50" min="1" max="200" style="max-width:120px;" />
    </div>
    <button class="btn-execute" id="btn-crawl">🕷️ ابدأ الزحف</button>
  </div>

  <!-- ====== تقرير OSINT ====== -->
  <div id="tab-osint" class="tab-content">
    <div class="input-group">
      <label>🔍 الكلمة المفتاحية</label>
      <input id="osint-query" type="text" placeholder="مثال: الذكاء الاصطناعي التوليدي 2025" />
    </div>
    <div class="input-group">
      <label>🌐 نطاقات مستهدفة</label>
      <input id="osint-domains" type="text" placeholder="مثال: .edu .gov wikipedia.org (اختياري)" />
    </div>
    <div class="input-group">
      <label>📅 النطاق الزمني</label>
      <select id="osint-time">
        <option value="">مفتوح</option>
        <option value="d">آخر 24 ساعة</option>
        <option value="w">آخر أسبوع</option>
        <option value="m">آخر شهر</option>
        <option value="y">آخر سنة</option>
      </select>
    </div>
    <button class="btn-execute" id="btn-osint">📊 إنشاء تقرير OSINT</button>
  </div>

  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p id="loader-text">جارٍ التنفيذ…</p>
  </div>

  <!-- Error -->
  <div class="error-banner" id="error-banner" style="display:none;"></div>

  <!-- Results -->
  <div class="results-area" id="results-area" style="display:none;">
    <div class="results-stats">
      <span class="count" id="results-count"></span>
      <span class="meta" id="results-meta"></span>
    </div>
    <div id="results-list"></div>
  </div>

</div><!-- /container -->

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLB()">✕</button>
  <img id="lb-img" src="" alt="" />
</div>

<script>
const API = '';

// ── Tab switching ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    hideResults();
  });
});

// ── Site-search activation glow ──────────────────────────────────────────────────
const siteQueryInput = document.getElementById('site-query');
const siteUrlWrap    = document.getElementById('site-url-wrap');
const siteUrlInput   = document.getElementById('site-url');

function updateSiteGlow() {
  const hasQuery = siteQueryInput.value.trim().length > 0;
  siteUrlWrap.classList.toggle('active-glow', hasQuery);
}
siteQueryInput.addEventListener('input', updateSiteGlow);

// ── Utilities ────────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlightKeyword(text, kw) {
  if (!kw || !text) return esc(text);
  const escaped_kw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(`(${escaped_kw})`, 'gi'), '<mark>$1</mark>');
}

function showLoader(msg) {
  document.getElementById('loader-text').textContent = msg;
  document.getElementById('loader').style.display = 'block';
  document.getElementById('results-area').style.display = 'none';
  document.getElementById('error-banner').style.display = 'none';
}
function hideLoader() { document.getElementById('loader').style.display = 'none'; }
function hideResults() {
  document.getElementById('results-area').style.display = 'none';
  document.getElementById('error-banner').style.display = 'none';
  hideLoader();
}
function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
  hideLoader();
}
function setLoading(btnId, on) {
  const btn = document.getElementById(btnId);
  if (btn) btn.disabled = on;
}

function openLB(src) { document.getElementById('lb-img').src = src; document.getElementById('lightbox').classList.add('open'); }
function closeLB()   { document.getElementById('lightbox').classList.remove('open'); document.getElementById('lb-img').src = ''; }
document.getElementById('lightbox').addEventListener('click', e => { if (e.target===e.currentTarget) closeLB(); });

// ── Thumb helper ─────────────────────────────────────────────────────────────────
function thumbHtml(src, clickable=true) {
  if (src) {
    const click = clickable ? `onclick="openLB('${src.replace(/'/g,"\\'")}'"` : '';
    return `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=no-img>🖼️</span>'" style="cursor:${clickable?'zoom-in':'default'}" ${click} />`;
  }
  return `<span class="no-img">🖼️</span>`;
}

// ── Show results ─────────────────────────────────────────────────────────────────
function showResultsArea(countText, metaText) {
  document.getElementById('results-count').textContent = countText;
  document.getElementById('results-meta').textContent  = metaText || '';
  document.getElementById('results-area').style.display = 'block';
}

// ── Render helpers ────────────────────────────────────────────────────────────────
function renderCards(items, bodyFn, thumbFn) {
  const list = document.getElementById('results-list');
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<div class="no-results">😕 لا توجد نتائج لعرضها.</div>'; return; }
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'result-card';
    div.innerHTML = `
      <div class="result-thumb">${thumbFn(item)}</div>
      <div class="result-details">
        <div class="r-title">${i+1}. ${bodyFn.title(item)}</div>
        <div class="r-url"><a href="${esc(item.url)}" target="_blank" rel="noreferrer">${esc(item.url)}</a></div>
        <div class="r-body">${bodyFn.body(item)}</div>
        ${bodyFn.meta ? `<div class="r-meta">${bodyFn.meta(item)}</div>` : ''}
      </div>`;
    list.appendChild(div);
  });
}

// ── POST helper ───────────────────────────────────────────────────────────────────
async function post(endpoint, body) {
  const res = await fetch(API + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ── 1. Search ─────────────────────────────────────────────────────────────────────
async function execSearch() {
  const q = document.getElementById('search-query').value.trim();
  if (!q) return;
  const limit = parseInt(document.getElementById('search-limit').value) || 10;
  setLoading('btn-search', true);
  showLoader('🔍 جارٍ البحث…');
  try {
    const data = await post('/search', { query: q, max_results: limit });
    if (data.error) { showError(data.error); return; }
    const results = data.results || [];
    showResultsArea(`${results.length} نتيجة`, `بحث: ${q}`);
    renderCards(results,
      { title: r => `<a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a>`,
        body:  r => esc(r.snippet || '') },
      r => `<span class="no-img">🔍</span>`
    );
  } catch(e) { showError(e.message); }
  finally { setLoading('btn-search', false); hideLoader(); }
}

// ── 2. Site search (full crawl) ───────────────────────────────────────────────────
async function execSite() {
  const q   = document.getElementById('site-query').value.trim();
  const url = document.getElementById('site-url').value.trim();
  if (!q) { showError('أدخل كلمة البحث.'); return; }
  if (!url) { showError('أدخل رابط الموقع المستهدف.'); return; }

  setLoading('btn-site', true);
  document.getElementById('crawl-status').classList.add('visible');
  document.getElementById('crawl-status-text').textContent =
    `جارٍ الزحف عبر صفحات ${url} والبحث عن «${q}»…`;
  showLoader(`🎯 يتم زحف جميع صفحات الموقع والبحث عن «${q}»…`);

  try {
    const data = await post('/site_search', { site_url: url, query: q });
    document.getElementById('crawl-status').classList.remove('visible');
    if (data.error && !data.results?.length) { showError(data.error); return; }
    const results = data.results || [];
    showResultsArea(
      `${results.length} صفحة تحتوي على «${q}»`,
      `تم زحف ${data.site_url}`
    );
    renderCards(results,
      { title: r => `<a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title || r.url)}</a>`,
        body:  r => highlightKeyword(r.excerpt || '', q),
        meta:  r => `<span>🌐 ${esc(r.url)}</span>` },
      r => thumbHtml(r.thumbnail)
    );
  } catch(e) {
    document.getElementById('crawl-status').classList.remove('visible');
    showError(e.message);
  }
  finally { setLoading('btn-site', false); hideLoader(); }
}

// ── 3. Scrape ─────────────────────────────────────────────────────────────────────
async function execScrape() {
  const url = document.getElementById('scrape-url').value.trim();
  if (!url) return;
  setLoading('btn-scrape', true);
  showLoader('📄 جارٍ استخراج الصفحة…');
  try {
    const data = await post('/scrape', { url });
    if (data.error) { showError(data.error); return; }
    showResultsArea('صفحة مستخرجة', url);
    const list = document.getElementById('results-list');
    list.innerHTML = `
      <div class="result-card">
        <div class="result-thumb">${thumbHtml(data.thumbnail)}</div>
        <div class="result-details">
          <div class="r-title"><a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(data.title || url)}</a></div>
          <div class="r-url"><a href="${esc(url)}" target="_blank">${esc(url)}</a></div>
          <div class="r-body">${esc((data.text || '').slice(0,1200))}</div>
          <div class="r-meta"><span>🖼️ ${(data.images||[]).length} صورة</span><span>🎬 ${(data.videos||[]).length} فيديو</span></div>
        </div>
      </div>`;
  } catch(e) { showError(e.message); }
  finally { setLoading('btn-scrape', false); hideLoader(); }
}

// ── 4. Agent ──────────────────────────────────────────────────────────────────────
async function execAgent() {
  const q = document.getElementById('agent-query').value.trim();
  if (!q) return;
  setLoading('btn-agent', true);
  showLoader('🧠 جارٍ تشغيل الوكيل الذكي…');
  try {
    const data = await post('/agent', { query: q });
    if (data.error && !data.response) { showError(data.error); return; }
    showResultsArea('رد الوكيل الذكي', '');
    document.getElementById('results-list').innerHTML = `
      <div class="result-card">
        <div class="result-thumb"><span class="no-img">🧠</span></div>
        <div class="result-details">
          <div class="r-title">🧠 ${esc(q)}</div>
          <div class="r-body agent-pre">${esc(data.response || '')}</div>
        </div>
      </div>`;
  } catch(e) { showError(e.message); }
  finally { setLoading('btn-agent', false); hideLoader(); }
}

// ── 5. Crawl ──────────────────────────────────────────────────────────────────────
async function execCrawl() {
  const url = document.getElementById('crawl-url').value.trim();
  if (!url) return;
  const limit = parseInt(document.getElementById('crawl-limit').value) || 50;
  setLoading('btn-crawl', true);
  showLoader('🕷️ جارٍ الزحف…');
  try {
    const data = await post('/crawl', { base_url: url, depth: 2, max_pages: limit });
    if (data.error && !data.links?.length) { showError(data.error); return; }
    const links = data.links || [];
    showResultsArea(`${links.length} رابط`, `زحف من ${url}`);
    const items = links.map(l => `<li><a href="${esc(l)}" target="_blank" rel="noreferrer">${esc(l)}</a></li>`).join('');
    document.getElementById('results-list').innerHTML =
      `<div class="result-card" style="border-right-color:#39d353;">
        <div class="result-details" style="width:100%">
          <ul class="link-list">${items}</ul>
        </div>
      </div>`;
  } catch(e) { showError(e.message); }
  finally { setLoading('btn-crawl', false); hideLoader(); }
}

// ── 6. OSINT report ───────────────────────────────────────────────────────────────
async function execOsint() {
  const q = document.getElementById('osint-query').value.trim();
  if (!q) return;
  setLoading('btn-osint', true);
  showLoader('📊 جارٍ بناء التقرير…');
  try {
    const data = await post('/report', {
      query: q,
      domains: document.getElementById('osint-domains').value.trim(),
      time_range: document.getElementById('osint-time').value,
      max_sources: 6,
    });
    if (data.error && !data.sources?.length) { showError(data.error); return; }
    const sources = data.sources || [];
    showResultsArea(`${sources.length} مصادر`, q);
    const list = document.getElementById('results-list');
    list.innerHTML = '';
    // Summary card
    if (data.summary) {
      const s = document.createElement('div');
      s.className = 'summary-card';
      s.innerHTML = `
        <div class="badge">📌 الملخص التنفيذي</div>
        <div class="adv-query">استعلام: ${esc(data.advanced_query || q)}</div>
        <div class="summary-text">${esc(data.summary)}</div>`;
      list.appendChild(s);
    }
    sources.forEach((src, i) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-thumb">${thumbHtml(src.thumbnail)}</div>
        <div class="result-details">
          <div class="r-title">${i+1}. <a href="${esc(src.url)}" target="_blank" rel="noreferrer">${esc(src.title||src.url)}</a></div>
          <div class="r-url"><a href="${esc(src.url)}" target="_blank">${esc(src.url)}</a></div>
          <div class="r-body">${esc((src.excerpt||src.snippet||'').slice(0,600))}</div>
          <div class="r-meta"><span>🖼️ ${(src.images||[]).length} صورة</span><span>🎬 ${(src.videos||[]).length} فيديو</span></div>
        </div>`;
      list.appendChild(card);
    });
  } catch(e) { showError(e.message); }
  finally { setLoading('btn-osint', false); hideLoader(); }
}

// ── Wire up buttons + Enter keys ─────────────────────────────────────────────────
document.getElementById('btn-search').addEventListener('click', execSearch);
document.getElementById('btn-site').addEventListener('click', execSite);
document.getElementById('btn-scrape').addEventListener('click', execScrape);
document.getElementById('btn-agent').addEventListener('click', execAgent);
document.getElementById('btn-crawl').addEventListener('click', execCrawl);
document.getElementById('btn-osint').addEventListener('click', execOsint);

document.getElementById('search-query').addEventListener('keydown', e => { if(e.key==='Enter') execSearch(); });
document.getElementById('site-query').addEventListener('keydown',   e => { if(e.key==='Enter') execSite();   });
document.getElementById('site-url').addEventListener('keydown',     e => { if(e.key==='Enter') execSite();   });
document.getElementById('scrape-url').addEventListener('keydown',   e => { if(e.key==='Enter') execScrape(); });
document.getElementById('crawl-url').addEventListener('keydown',    e => { if(e.key==='Enter') execCrawl();  });
document.getElementById('osint-query').addEventListener('keydown',  e => { if(e.key==='Enter') execOsint();  });
document.getElementById('agent-query').addEventListener('keydown',  e => { if(e.ctrlKey&&e.key==='Enter') execAgent(); });
</script>
</body>
