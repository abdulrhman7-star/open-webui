<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بحث ذكي عن المحتوى</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #21262d;
      --border:   #30363d;
      --c-search: #58a6ff;
      --c-scrape: #3fb950;
      --c-agent:  #d2a8ff;
      --c-crawl:  #f78166;
      --c-osint:  #ffa657;
      --c-site:   #39d353;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --radius:   12px;
    }

    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--c-search), var(--c-osint));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; flex-shrink: 0;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header p  { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    /* ── Layout ── */
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* ── Mode tabs ── */
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab {
      cursor: pointer;
      padding: .55rem 1.2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: .88rem;
      font-family: inherit;
      display: flex; align-items: center; gap: .45rem;
      transition: all .2s;
    }
    .tab:hover { color: var(--text); border-color: var(--c-search); }
    .tab.active                     { background: var(--c-search); border-color: var(--c-search); color: #fff; }
    .tab[data-mode="scrape"].active { background: var(--c-scrape); border-color: var(--c-scrape); }
    .tab[data-mode="agent"].active  { background: var(--c-agent);  border-color: var(--c-agent); color: #1a1a2e; }
    .tab[data-mode="crawl"].active  { background: var(--c-crawl);  border-color: var(--c-crawl); }
    .tab[data-mode="osint"].active  { background: var(--c-osint);  border-color: var(--c-osint); color: #1a1a2e; }
    .tab[data-mode="site"].active   { background: var(--c-site);   border-color: var(--c-site);  color: #0d1117; }

    /* ── Input card ── */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .field { display: flex; flex-direction: column; gap: .4rem; }
    .field label { font-size: .82rem; color: var(--muted); }
    .field input, .field select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    .field input:focus, .field select:focus { border-color: var(--c-search); }
    .field input::placeholder { color: var(--muted); }
    .field select option { background: var(--surface2); }

    .input-row { display: flex; gap: .75rem; align-items: flex-end; }
    .input-row .field { flex: 1; }

    .osint-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .85rem;
    }

    button.run {
      cursor: pointer;
      padding: .72rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: var(--c-search);
      color: #fff;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 700;
      white-space: nowrap;
      display: flex; align-items: center; gap: .45rem;
      transition: opacity .2s, transform .1s;
      flex-shrink: 0;
    }
    button.run:hover   { opacity: .88; }
    button.run:active  { transform: scale(.97); }
    button.run:disabled { opacity: .45; cursor: not-allowed; }
    button.run.osint-btn { background: var(--c-osint); color: #1a1a2e; width: 100%; justify-content: center; font-size: 1rem; padding: .85rem; }
    button.run.site-btn  { background: var(--c-site);  color: #0d1117; width: 100%; justify-content: center; font-size: 1rem; padding: .85rem; }

    /* ── Site search — detected form info badge ── */
    .detect-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(57,211,83,.12); border: 1px solid var(--c-site);
      color: var(--c-site); border-radius: 8px;
      padding: .45rem .85rem; font-size: .78rem;
      margin-bottom: 1rem; direction: ltr; text-align: left;
      word-break: break-all;
    }

    /* ── Results ── */
    #results-container { display: flex; flex-direction: column; gap: 1rem; }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }

    .card-title { font-weight: 700; font-size: 1rem; margin-bottom: .35rem; }
    .card-title a { color: var(--c-search); text-decoration: none; }
    .card-title a:hover { text-decoration: underline; }
    .card-url { font-size: .76rem; color: var(--c-scrape); margin-bottom: .6rem; word-break: break-all; direction: ltr; text-align: left; }
    .card-body { color: var(--muted); font-size: .88rem; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }

    /* ── OSINT Report styles ── */
    .summary-card {
      background: linear-gradient(135deg, rgba(255,166,87,.08), rgba(88,166,255,.06));
      border: 1px solid var(--c-osint);
      border-radius: var(--radius);
      padding: 1.5rem;
      animation: fadeIn .4s ease;
    }
    .summary-card .badge {
      display: inline-flex; align-items: center; gap: .4rem;
      background: var(--c-osint); color: #1a1a2e;
      font-size: .75rem; font-weight: 700;
      padding: .2rem .75rem; border-radius: 20px;
      margin-bottom: .85rem;
    }
    .summary-card .query-line {
      font-size: .8rem; color: var(--muted); margin-bottom: .75rem;
      direction: ltr; text-align: left;
    }
    .summary-text {
      font-size: .95rem; line-height: 1.9; white-space: pre-wrap; direction: auto; text-align: start;
    }

    .source-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeIn .35s ease;
    }
    .source-header {
      padding: 1rem 1.25rem .75rem;
      border-bottom: 1px solid var(--border);
    }
    .source-num {
      display: inline-block;
      background: var(--surface2);
      color: var(--c-osint);
      font-size: .72rem; font-weight: 700;
      padding: .15rem .6rem; border-radius: 20px;
      margin-bottom: .5rem;
    }
    .source-title { font-weight: 700; font-size: .97rem; margin-bottom: .3rem; }
    .source-title a { color: var(--c-search); text-decoration: none; }
    .source-title a:hover { text-decoration: underline; }
    .source-url { font-size: .74rem; color: var(--c-scrape); word-break: break-all; direction: ltr; text-align: left; }

    .source-body { padding: 1rem 1.25rem; }
    .excerpt { font-size: .86rem; color: var(--muted); line-height: 1.75; white-space: pre-wrap; word-break: break-word; direction: auto; text-align: start; }

    /* media grid */
    .media-section { padding: 0 1.25rem 1.1rem; }
    .media-label { font-size: .75rem; color: var(--muted); margin-bottom: .6rem; }
    .img-grid {
      display: flex; gap: .5rem; flex-wrap: wrap;
    }
    .img-grid img {
      width: 110px; height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: opacity .2s;
    }
    .img-grid img:hover { opacity: .8; }
    .vid-list { display: flex; flex-direction: column; gap: .5rem; }
    .vid-item {
      display: flex; align-items: center; gap: .75rem;
      background: var(--surface2); border-radius: 8px; padding: .5rem .75rem;
    }
    .vid-item img { width: 80px; height: 56px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
    .vid-item a { color: var(--c-search); font-size: .83rem; word-break: break-all; }

    /* lightbox */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.88); z-index: 999;
      align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
    #lightbox-close {
      position: absolute; top: 1.5rem; left: 1.5rem;
      background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer;
    }

    /* link list (crawl) */
    .link-list { list-style: none; }
    .link-list li { padding: .4rem 0; border-bottom: 1px solid var(--border); font-size: .86rem; direction: ltr; text-align: left; }
    .link-list li:last-child { border-bottom: none; }
    .link-list a { color: var(--c-search); word-break: break-all; }

    .state-msg { text-align: center; color: var(--muted); padding: 3rem 0; font-size: .92rem; }
    .state-msg .icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .error-banner { background: rgba(247,129,102,.1); border: 1px solid var(--c-crawl); border-radius: var(--radius); padding: 1rem 1.5rem; color: var(--c-crawl); font-size: .9rem; }
    .summary-badge { font-size: .8rem; color: var(--muted); margin-bottom: .75rem; }
    .summary-badge strong { color: var(--text); }
    .agent-response { font-size: .93rem; line-height: 1.9; color: var(--text); white-space: pre-wrap; direction: auto; text-align: start; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .osint-grid { grid-template-columns: 1fr; }
      .input-row { flex-direction: column; }
      .tabs { gap: .3rem; }
      .tab { font-size: .8rem; padding: .42rem .85rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🔍</div>
  <div>
    <h1>بحث ذكي عن المحتوى</h1>
    <p>ابحث، استخرج، وحلّل المحتوى بالذكاء الاصطناعي</p>
  </div>
</header>

<main>

  <!-- Mode tabs -->
  <div class="tabs">
    <button class="tab active" data-mode="search">🔍 بحث</button>
    <button class="tab" data-mode="site">🎯 بحث في موقع</button>
    <button class="tab" data-mode="scrape">📄 استخراج صفحة</button>
    <button class="tab" data-mode="agent">🤖 المساعد الذكي</button>
    <button class="tab" data-mode="crawl">🕷️ زحف الموقع</button>
    <button class="tab" data-mode="osint">📊 تقرير OSINT</button>
  </div>

  <!-- Input card (rendered dynamically) -->
  <div class="input-card" id="input-card"></div>

  <!-- Results -->
  <div id="results-container">
    <div class="state-msg"><div class="icon">🌐</div><div>اختر وضع العمل وأدخل استعلامك للبدء</div></div>
  </div>

</main>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
const API = '';
let currentMode = 'search';

// ── Render input card per mode ──────────────────────────────────────────────────

function renderInputCard() {
  const card = document.getElementById('input-card');
  if (currentMode === 'site') {
    card.innerHTML = `
      <div class="field">
        <label>🌐 رابط الموقع المستهدف</label>
        <input id="q-site-url" type="text" placeholder="مثال: https://aljazeera.net أو bbc.com/arabic" />
      </div>
      <div class="field">
        <label>🔍 كلمة البحث</label>
        <input id="q-site-query" type="text" placeholder="مثال: الذكاء الاصطناعي" />
      </div>
      <button class="run site-btn" id="run-btn" onclick="run()">
        <span id="btn-icon">🎯</span>
        <span id="btn-text">بحث داخل الموقع</span>
      </button>`;
    document.getElementById('q-site-query').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    document.getElementById('q-site-url').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  } else if (currentMode === 'osint') {
    card.innerHTML = `
      <div class="field">
        <label>🔍 الكلمة المفتاحية أو العبارة</label>
        <input id="q-main" type="text" placeholder="مثال: الذكاء الاصطناعي التوليدي 2025" />
      </div>
      <div class="osint-grid">
        <div class="field">
          <label>🌐 نطاقات مستهدفة (اختياري)</label>
          <input id="q-domains" type="text" placeholder="مثال: .edu .gov wikipedia.org" />
        </div>
        <div class="field">
          <label>📅 النطاق الزمني</label>
          <select id="q-time">
            <option value="">مفتوح</option>
            <option value="d">آخر 24 ساعة</option>
            <option value="w">آخر أسبوع</option>
            <option value="m">آخر شهر</option>
            <option value="y">آخر سنة</option>
          </select>
        </div>
      </div>
      <button class="run osint-btn" id="run-btn" onclick="run()">
        <span id="btn-icon">📊</span>
        <span id="btn-text">إنشاء تقرير OSINT</span>
      </button>`;
    document.getElementById('q-main').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  } else {
    const labels = {
      search: 'أدخل كلمات البحث',
      scrape: 'أدخل رابط الصفحة',
      agent:  'اسأل المساعد الذكي',
      crawl:  'أدخل الرابط الرئيسي للموقع',
    };
    const placeholders = {
      search: 'مثال: تقنية الذكاء الاصطناعي في 2025',
      scrape: 'https://example.com/article',
      agent:  'ما هي أبرز اتجاهات الذكاء الاصطناعي؟',
      crawl:  'https://example.com',
    };
    card.innerHTML = `
      <label style="font-size:.82rem;color:var(--muted)">${labels[currentMode]}</label>
      <div class="input-row">
        <div class="field"><input id="query-input" type="text" placeholder="${placeholders[currentMode]}" /></div>
        <button class="run" id="run-btn" onclick="run()">
          <span id="btn-icon">▶</span>
          <span id="btn-text">تنفيذ</span>
        </button>
      </div>`;
    document.getElementById('query-input').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  }
}

// ── Tab switching ───────────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    renderInputCard();
    showPlaceholder();
  });
});

renderInputCard();   // initial render

// ── Helpers ─────────────────────────────────────────────────────────────────────

function showPlaceholder() {
  document.getElementById('results-container').innerHTML =
    `<div class="state-msg"><div class="icon">🌐</div><div>اختر وضع العمل وأدخل استعلامك للبدء</div></div>`;
}

function setLoading(on) {
  const btn = document.getElementById('run-btn');
  if (!btn) return;
  btn.disabled = on;
  const icon = document.getElementById('btn-icon');
  const txt  = document.getElementById('btn-text');
  if (currentMode === 'osint') {
    icon.innerHTML = on ? '<span class="spinner" style="border-top-color:#1a1a2e;border-color:rgba(26,26,46,.3)"></span>' : '📊';
    txt.textContent = on ? 'جارٍ التحليل...' : 'إنشاء تقرير OSINT';
  } else if (currentMode === 'site') {
    icon.innerHTML = on ? '<span class="spinner" style="border-top-color:#0d1117;border-color:rgba(13,17,23,.3)"></span>' : '🎯';
    txt.textContent = on ? 'جارٍ الكشف والبحث...' : 'بحث داخل الموقع';
  } else {
    icon.innerHTML = on ? '<span class="spinner"></span>' : '▶';
    txt.textContent = on ? 'جارٍ التنفيذ...' : 'تنفيذ';
  }
}

function showError(msg) {
  document.getElementById('results-container').innerHTML =
    `<div class="error-banner">⚠️ ${esc(msg)}</div>`;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});

// ── Main run ────────────────────────────────────────────────────────────────────

async function run() {
  let q = '';
  if (currentMode === 'osint') {
    q = (document.getElementById('q-main')?.value || '').trim();
  } else if (currentMode === 'site') {
    q = (document.getElementById('q-site-query')?.value || '').trim();
  } else {
    q = (document.getElementById('query-input')?.value || '').trim();
  }
  if (!q) return;

  setLoading(true);
  document.getElementById('results-container').innerHTML =
    `<div class="state-msg"><span class="spinner" style="width:34px;height:34px;border-width:3px;"></span></div>`;

  try {
    let body, endpoint;

    if (currentMode === 'search') {
      endpoint = '/search'; body = { query: q, max_results: 10 };
    } else if (currentMode === 'site') {
      const siteUrl = (document.getElementById('q-site-url')?.value || '').trim();
      if (!siteUrl) { showError('يرجى إدخال رابط الموقع المستهدف'); setLoading(false); return; }
      endpoint = '/site_search'; body = { site_url: siteUrl, query: q };
    } else if (currentMode === 'scrape') {
      endpoint = '/scrape'; body = { url: q };
    } else if (currentMode === 'agent') {
      endpoint = '/agent'; body = { query: q };
    } else if (currentMode === 'crawl') {
      endpoint = '/crawl'; body = { base_url: q, depth: 2, max_pages: 50 };
    } else {
      endpoint = '/report';
      body = {
        query: q,
        domains: (document.getElementById('q-domains')?.value || '').trim(),
        time_range: document.getElementById('q-time')?.value || '',
        max_sources: 6,
      };
    }

    const res  = await fetch(API + endpoint, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();

    if (data.error && !data.sources?.length) { showError(data.error); return; }
    renderResults(data);
  } catch(e) {
    showError(e.message || 'حدث خطأ غير متوقع');
  } finally {
    setLoading(false);
  }
}

// ── Render functions ────────────────────────────────────────────────────────────

function renderResults(data) {
  const c = document.getElementById('results-container');
  c.innerHTML = '';

  if (currentMode === 'search') {
    const results = data.results || [];
    if (!results.length) { c.innerHTML = '<div class="state-msg"><div class="icon">😶</div><div>لا توجد نتائج</div></div>'; return; }
    c.innerHTML = `<div class="summary-badge">تم العثور على <strong>${results.length}</strong> نتيجة</div>`;
    results.forEach(r => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="card-title"><a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a></div>
        <div class="card-url">${esc(r.url)}</div>
        <div class="card-body">${esc(r.snippet)}</div>`;
      c.appendChild(card);
    });

  } else if (currentMode === 'scrape') {
    const text = (data.text || '').trim();
    if (!text) { c.innerHTML = '<div class="state-msg"><div class="icon">📭</div><div>لم يتم استخراج أي نص</div></div>'; return; }
    c.innerHTML = `
      <div class="result-card">
        <div class="card-title">📄 ${esc(data.url)}</div>
        <div class="card-body" style="direction:auto;text-align:start;">${esc(text)}</div>
      </div>`;

  } else if (currentMode === 'agent') {
    const resp = (data.response || '').trim();
    if (!resp) { c.innerHTML = '<div class="state-msg"><div class="icon">🤔</div><div>لا يوجد رد</div></div>'; return; }
    c.innerHTML = `
      <div class="result-card">
        <div class="card-title">🤖 رد المساعد</div>
        <div class="agent-response">${esc(resp)}</div>
      </div>`;

  } else if (currentMode === 'crawl') {
    const links = data.links || [];
    if (!links.length) { c.innerHTML = '<div class="state-msg"><div class="icon">🕸️</div><div>لم يتم العثور على روابط داخلية</div></div>'; return; }
    const items = links.map(l => `<li><a href="${esc(l)}" target="_blank" rel="noreferrer">${esc(l)}</a></li>`).join('');
    c.innerHTML = `
      <div class="summary-badge">تم الزحف على <strong>${links.length}</strong> رابطاً من <strong>${esc(data.base_url)}</strong></div>
      <div class="result-card"><ul class="link-list">${items}</ul></div>`;

  } else if (currentMode === 'site') {
    const results = data.results || [];
    if (!results.length) {
      c.innerHTML = `<div class="state-msg"><div class="icon">🔎</div><div>${esc(data.error || 'لم يتم العثور على نتائج')}</div></div>`;
      return;
    }
    // Detection info banner
    const detectHtml = data.method_used
      ? `<div class="detect-badge">✅ ${esc(data.method_used)}</div>`
      : '';
    c.innerHTML = `
      ${detectHtml}
      <div class="summary-badge">تم العثور على <strong>${results.length}</strong> نتيجة داخل <strong>${esc(data.site_url)}</strong></div>`;
    results.forEach(r => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="card-title"><a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.title)}</a></div>
        <div class="card-url">${esc(r.url)}</div>
        ${r.snippet ? `<div class="card-body">${esc(r.snippet)}</div>` : ''}`;
      c.appendChild(card);
    });

  } else {
    renderOsintReport(data);
  }
}

function renderOsintReport(data) {
  const c = document.getElementById('results-container');
  const sources = data.sources || [];

  // ── Executive summary card ──
  const summaryCard = document.createElement('div');
  summaryCard.className = 'summary-card';
  summaryCard.innerHTML = `
    <div class="badge">📌 الملخص التنفيذي</div>
    <div class="query-line">استعلام متقدم: ${esc(data.advanced_query || data.query)}</div>
    <div class="summary-text">${esc(data.summary || 'لا يوجد ملخص متاح.')}</div>`;
  c.appendChild(summaryCard);

  if (!sources.length) {
    c.innerHTML += '<div class="state-msg"><div class="icon">😶</div><div>لم يتم العثور على مصادر</div></div>';
    return;
  }

  // Label
  const label = document.createElement('div');
  label.className = 'summary-badge';
  label.innerHTML = `<strong>💎 المصادر الرئيسية المُحللة</strong> — ${sources.length} مصادر`;
  c.appendChild(label);

  // ── Source cards ──
  sources.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'source-card';

    // Header
    card.innerHTML = `
      <div class="source-header">
        <div class="source-num">المصدر ${i + 1}</div>
        <div class="source-title"><a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title || s.url)}</a></div>
        <div class="source-url">${esc(s.url)}</div>
      </div>`;

    // Excerpt
    const excerpt = (s.excerpt || s.snippet || '').trim();
    if (excerpt) {
      const bodyEl = document.createElement('div');
      bodyEl.className = 'source-body';
      bodyEl.innerHTML = `<div class="excerpt">${esc(excerpt.slice(0, 600))}${excerpt.length > 600 ? '…' : ''}</div>`;
      card.appendChild(bodyEl);
    }

    // Images
    const images = s.images || [];
    if (images.length) {
      const sec = document.createElement('div');
      sec.className = 'media-section';
      sec.innerHTML = `<div class="media-label">🖼️ صور مستخرجة</div>`;
      const grid = document.createElement('div');
      grid.className = 'img-grid';
      images.forEach(img => {
        const el = document.createElement('img');
        el.src = img.src;
        el.alt = img.alt || '';
        el.title = img.alt || '';
        el.loading = 'lazy';
        el.onerror = function() { this.style.display='none'; };
        el.onclick = () => openLightbox(img.src);
        grid.appendChild(el);
      });
      sec.appendChild(grid);
      card.appendChild(sec);
    }

    // Videos
    const videos = s.videos || [];
    if (videos.length) {
      const sec = document.createElement('div');
      sec.className = 'media-section';
      sec.innerHTML = `<div class="media-label">🎬 فيديوهات مستخرجة</div>`;
      const list = document.createElement('div');
      list.className = 'vid-list';
      videos.forEach(v => {
        const item = document.createElement('div');
        item.className = 'vid-item';
        if (v.thumb) {
          item.innerHTML += `<img src="${esc(v.thumb)}" alt="thumbnail" loading="lazy" onerror="this.style.display='none'" />`;
        }
        const watchUrl = v.watch || v.src;
        item.innerHTML += `<a href="${esc(watchUrl)}" target="_blank" rel="noreferrer">${esc(watchUrl)}</a>`;
        list.appendChild(item);
      });
      sec.appendChild(list);
      card.appendChild(sec);
    }

    c.appendChild(card);
  });
}
</script>
